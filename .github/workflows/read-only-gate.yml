name: Read-Only Safety Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pre-azure-validation:
    name: Pre-Azure validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run canonical pre-Azure validation
        shell: pwsh
        run: ./Tools/Invoke-PreAzureValidation.ps1
